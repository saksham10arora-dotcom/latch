<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Latch mark: a blue bolt in the shape of an L, dropping into an amber
       keeper. Reads as the letter at large sizes and as a latch closing at 16px,
       and reuses the app's own two colours: blue for what is running, amber for
       the thing that holds. -->
  <rect width="128" height="128" rx="29" fill="#0e1015"/>
  <rect x=".75" y=".75" width="126.5" height="126.5" rx="28.25"
        fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1.5"/>
  <path d="M40 24 V74 a15 15 0 0 0 15 15 H72"
        fill="none" stroke="#5b9dff" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="82" y="66" width="16" height="42" rx="8" fill="#f8b45a"/>
</svg>
